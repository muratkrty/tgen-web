<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticagen</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --pad-x: clamp(20px, 3vw, 40px);
      --pad-y: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    .site-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--pad-y) var(--pad-x);
      gap: 32px;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--fg);
      text-decoration: none;
      flex: 0 0 auto;
      min-width: 0;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      object-fit: contain;
      display: block;
      flex: 0 0 auto;
    }

    .brand-name {
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: clamp(18px, 2.5vw, 46px);
      flex-wrap: wrap;
    }

    .nav a {
      color: var(--fg);
      text-decoration: none;
      font-size: clamp(14px, 1.1vw, 18px);
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      opacity: 0.96;
      transition: opacity 0.18s ease;
    }

    .nav a:hover {
      opacity: 0.72;
    }

    .hero {
      flex: 1;
      min-height: calc(100vh - 88px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
    }

    .wordmark {
      color: var(--fg);
      font-size: clamp(48px, 10vw, 120px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      text-align: center;
      margin: 0;
    }

    .email {
      color: var(--fg);
      font-size: clamp(14px, 2vw, 24px);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-align: center;
      opacity: 0.9;
      text-decoration: none;
    }

    .email:hover {
      opacity: 0.72;
    }

    @media (max-width: 900px) {
      .site-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav {
        justify-content: flex-start;
        gap: 18px 24px;
      }

      .hero {
        min-height: auto;
        padding: 72px 24px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="Ticagen home">
      <img class="brand-logo" src="assets/wlogo.png" alt="Ticagen logo" />
      <span class="brand-name">TICAGEN</span>
    </a>

    <nav class="nav" aria-label="Primary navigation">
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#capabilities">Capabilities</a>
      <a href="#about">About us</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <div class="wrap">
      <h1 class="wordmark">Ticagen</h1>
      <a class="email" href="mailto:contact@ticagen.ai">contact@ticagen.ai</a>
    </div>
  </main>
</body>
</html>
