<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticagen</title>
  <link rel="icon" href="assets/favicon_io2/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="assets/favicon_io2/android-chrome-512x512.png" />
  <link rel="apple-touch-icon" href="assets/favicon_io2/apple-touch-icon.png" />

  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --pad-x: clamp(20px, 3vw, 40px);
      --pad-y: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    .site-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--pad-y) var(--pad-x);
      gap: 32px;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--fg);
      text-decoration: none;
      flex: 0 0 auto;
      min-width: 0;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      object-fit: contain;
      display: block;
      flex: 0 0 auto;
    }

    .brand-name {
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: clamp(18px, 2.5vw, 46px);
      flex-wrap: wrap;
    }

    .nav a {
      color: var(--fg);
      text-decoration: none;
      font-size: clamp(14px, 1.1vw, 18px);
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      opacity: 0.96;
      transition: opacity 0.18s ease;
    }

    .nav a:hover {
      opacity: 0.72;
    }

    .hero {
      flex: 1;
      min-height: calc(100vh - 88px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      width: 100%;
    }

    .wordmark {
      color: var(--fg);
      font-size: clamp(48px, 10vw, 120px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      text-align: center;
      margin: 0;
      text-wrap: balance;
    }

    .email {
      color: var(--fg);
      font-size: clamp(14px, 2vw, 24px);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-align: center;
      opacity: 0.9;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .email:hover {
      opacity: 0.72;
    }

    @media (max-width: 900px) {
      .site-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
      }

      .nav {
        justify-content: flex-start;
        gap: 16px 20px;
      }

      .hero {
        min-height: auto;
        padding: 64px 24px 80px;
      }
    }

    @media (max-width: 640px) {
      :root {
        --pad-x: 16px;
        --pad-y: 18px;
      }

      .site-header {
        align-items: center;
        gap: 16px;
      }

      .brand {
        justify-content: center;
      }

      .brand-logo {
        width: 32px;
        height: 32px;
      }

      .brand-name {
        font-size: 22px;
      }

      .nav {
        width: 100%;
        justify-content: center;
        gap: 10px;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 4px;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .nav::-webkit-scrollbar {
        display: none;
      }

      .nav a {
        font-size: 14px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        flex: 0 0 auto;
      }

      .hero {
        min-height: calc(100vh - 120px);
        padding: 40px 20px 56px;
      }

      .wrap {
        gap: 12px;
      }

      .wordmark {
        font-size: clamp(42px, 16vw, 72px);
      }

      .email {
        font-size: 15px;
        letter-spacing: 0.04em;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="Ticagen home">
      <img class="brand-logo" src="assets/wlogo.png" alt="Ticagen logo" />
      <span class="brand-name">TICAGEN AI</span>
    </a>

    <nav class="nav" aria-label="Primary navigation">
      <a href="#home">Home</a>
      <a href="#capabilities">Capabilities</a>
      <a href="#research">Research</a>
      <a href="#about">About</a>
      
    </nav>
  </header>

  <main class="hero" id="home">
    <div class="wrap">
      <h1 class="wordmark">Ticagen</h1>
      <a class="email" href="mailto:contact@ticagen.ai">contact@ticagen.ai</a>
    </div>
  </main>
</body>
</html>
